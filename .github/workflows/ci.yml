name: CI

on:
  push:
  pull_request:

jobs:
  pilot-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Compile Python
        run: python -m compileall aionboard tests
      - name: Run pilot acceptance tests
        run: python -m unittest discover -s tests -v
